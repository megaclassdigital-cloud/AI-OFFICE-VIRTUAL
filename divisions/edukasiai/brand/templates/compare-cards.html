<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="base.css">
</head>
<body>
<div class="counter" data-slide-counter></div>
<div class="frame">
  <div class="kicker plain top" data-slot="kicker"></div>
  <div class="main">
    <div class="cards">
      <div class="card">
        <div class="ct" data-slot="leftTitle"></div>
        <div class="ic" data-slot="leftIcon"></div>
        <p data-slot="leftBody"></p>
      </div>
      <div class="ic arrow" data-icon="double-arrow"></div>
      <div class="card">
        <div class="ct" data-slot="rightTitle"></div>
        <div class="ic" data-slot="rightIcon"></div>
        <p data-slot="rightBody"></p>
      </div>
    </div>
    <p class="lede wide" data-slot="caption"></p>
  </div>
  <div class="footer"><span class="brandmark" data-brandmark></span><span class="src" data-slot="source"></span></div>
</div>
</body>
</html>

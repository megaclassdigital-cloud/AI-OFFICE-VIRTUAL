<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="base.css">
</head>
<body>
<div class="counter" data-slide-counter></div>
<div class="frame">
  <div class="kicker plain top" data-slot="kicker"></div>
  <div class="main">
    <div class="flowbox">
      <svg class="flowlines" viewBox="0 0 936 560" aria-hidden="true">
        <path d="M150 120 C 230 40, 330 40, 400 100" /><path d="M540 100 C 610 40, 710 40, 790 120" />
        <path d="M790 250 C 830 340, 800 420, 700 450" /><path d="M520 470 C 440 500, 330 500, 260 470" /><path d="M130 420 C 90 360, 90 300, 130 250" />
      </svg>
      <div class="node n1"><div class="ic ring" data-slot="s1Icon"></div><div class="nl" data-slot="s1"></div></div>
      <div class="node n2"><div class="ic ring" data-slot="s2Icon"></div><div class="nl" data-slot="s2"></div></div>
      <div class="node n3"><div class="ic ring" data-slot="s3Icon"></div><div class="nl" data-slot="s3"></div></div>
      <div class="node n4"><div class="ic ring" data-slot="s4Icon"></div><div class="nl" data-slot="s4"></div></div>
      <div class="node n5"><div class="ic ring" data-slot="s5Icon"></div><div class="nl" data-slot="s5"></div></div>
    </div>
    <p class="lede wide" data-slot="caption"></p>
  </div>
  <div class="footer"><span class="brandmark" data-brandmark></span><span class="src" data-slot="source"></span></div>
</div>
</body>
</html>

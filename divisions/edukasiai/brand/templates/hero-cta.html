<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="base.css">
</head>
<body>
<img class="hero-img short" data-slot="image" alt="">
<div class="counter" data-slide-counter></div>
<div class="frame">
  <div class="spacer short"></div>
  <div class="main end">
    <div class="kicker plain" data-slot="kicker"></div>
    <h2 class="hl" data-slot="headline"></h2>
    <div class="cta2">
      <div class="col"><div class="ic sm" data-icon="bookmark"></div><div><div class="ctt" data-slot="saveTitle"></div><p data-slot="saveText"></p></div></div>
      <div class="col"><div class="ic sm" data-icon="user-plus"></div><div><div class="ctt" data-slot="followTitle"></div><p data-slot="followText"></p></div></div>
    </div>
    <div class="support"><div class="ic xs" data-icon="heart"></div><p data-slot="support"></p></div>
  </div>
  <div class="footer"><span class="brandmark" data-brandmark></span><span class="src" data-slot="source"></span></div>
</div>
</body>
</html>

<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="base.css">
</head>
<body>
<div class="counter" data-slide-counter></div>
<div class="frame">
  <div class="kicker plain top" data-slot="kicker"></div>
  <div class="main">
    <div class="rows">
      <div class="row"><div class="ic" data-slot="i1Icon"></div><div><div class="rt" data-slot="i1Title"></div><p data-slot="i1Text"></p></div></div>
      <div class="row"><div class="ic" data-slot="i2Icon"></div><div><div class="rt" data-slot="i2Title"></div><p data-slot="i2Text"></p></div></div>
      <div class="row"><div class="ic" data-slot="i3Icon"></div><div><div class="rt" data-slot="i3Title"></div><p data-slot="i3Text"></p></div></div>
      <div class="row"><div class="ic" data-slot="i4Icon"></div><div><div class="rt" data-slot="i4Title"></div><p data-slot="i4Text"></p></div></div>
    </div>
  </div>
  <div class="footer"><span class="brandmark" data-brandmark></span><span class="src" data-slot="source"></span></div>
</div>
</body>
</html>
